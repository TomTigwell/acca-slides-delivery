name: Generate ACCA Slides
on: { workflow_dispatch: {}, push: { branches: ['claude/keyless-github-action-ht6e7p'] } } # TEMP: generating ACCA Brand July report; remove once confirmed
permissions: { id-token: write, contents: read }
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/1003823905197/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: slides-report-bot@fmf-slides-automation.iam.gserviceaccount.com
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install
      - run: node inspect9.mjs
